<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upper-Body Size Tracker</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1c1c1a;--mu:#666;--ac:#c2410c;--bd:#e4e4de;--ok:#15803d;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#201f1d;--tx:#eeeeea;--mu:#a3a39b;--ac:#fb923c;--bd:#33322f;--ok:#4ade80;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#151514;--card:#201f1d;--tx:#eeeeea;--mu:#a3a39b;--ac:#fb923c;--bd:#33322f;--ok:#4ade80;--wn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:14px;max-width:640px;margin:auto}
h1{font-size:1.4rem;margin:6px 0 10px}h2{font-size:1rem;margin:18px 0 8px;color:var(--ac)}
.tabs,.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.tabs button,.days button{flex:1;white-space:nowrap;padding:8px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx)}
.tabs button.on,.days button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.t{display:flex;justify-content:space-between;font-weight:600;gap:8px}.t span{color:var(--ac);white-space:nowrap}
.h{color:var(--mu);font-size:.85rem;margin:2px 0 8px}
.r{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center;color:var(--mu);font-size:.85rem}
input{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.go{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;margin:6px 0}
.row{display:flex;gap:6px}.row button{padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.m:last-child{border:0}.up{color:var(--ok)}.dn{color:var(--wn)}
svg{width:90px;height:28px;flex:none}svg polyline{fill:none;stroke:var(--ac);stroke-width:2}
.v{border-left:4px solid var(--ac);padding:8px 12px;background:var(--card);border-radius:8px;margin-bottom:8px;font-size:.92rem}
.s{color:var(--mu);font-size:.8rem;margin-top:14px}
.l{margin-top:6px}.l a{display:inline-block;margin-right:8px;padding:5px 12px;border:1px solid var(--bd);border-radius:999px;color:var(--tx);text-decoration:none;font-size:.85rem}
</style></head><body>
<h1>Upper-Body Size Tracker</h1>
<div class="tabs"><button id="tt" class="on">Train</button><button id="tp">Progress</button></div>
<div id="app"></div>
<p class="s" id="st"></p>
<script>
const D=[
["Upper (Push)",[["Incline dumbbell press","4 x 8-10"],["Seated dumbbell shoulder press","3 x 8-10"],["Weighted dips (lean forward)","3 x 8-12"],["Cable lateral raise","3 x 12-15"],["Triceps rope pushdown","3 x 10-12"]]],
["Lower + Core",[["Squat or leg press","3 x 8-10"],["Romanian deadlift","3 x 8-10"],["Walking lunges","2 x 10"],["Calf raise","3 x 12-15"],["Hanging leg raise","3 x 10-12"]]],
["Upper (Pull)",[["Weighted pull-up or lat pulldown","4 x 6-10"],["Chest-supported or barbell row","4 x 8-10"],["Single-arm cable row","3 x 10-12"],["Face pull","3 x 15"],["Incline dumbbell curl","3 x 10-12"]]],
["Upper (Shoulders, chest, arms)",[["Incline barbell press","3 x 8-10"],["Cable fly","3 x 12-15"],["Dumbbell lateral raise","4 x 12-20"],["Overhead triceps extension","3 x 10-12"],["Hammer curl","3 x 10-12"],["Shrugs (optional)","3 x 12"]]]];
let S={sessions:[],bw:[]},tab="t",day=0,draft={},dbDoc=null,note="Saving to this browser only.";
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
const e1=(w,r)=>w*(1+r/30);
function persist(){
  try{localStorage.setItem("ubt",JSON.stringify(S))}catch(e){}
  if(dbDoc)dbDoc.set({data:JSON.stringify(S)}).catch(()=>{note="Cloud save failed; saved in this browser."});
}
async function init(){
  try{const l=localStorage.getItem("ubt");if(l)S=JSON.parse(l)}catch(e){}
  render();
  try{
    const c=window.claude&&await claude.use("db"),u=window.claude&&await claude.use("user");
    const id=u&&await u.id();
    if(c&&id){
      dbDoc=c.collection("data/users/"+id).doc("log");
      const s=await dbDoc.get();
      if(s.exists){const r=JSON.parse(s.data().data);
        if(r&&r.sessions&&r.sessions.length>=S.sessions.length)S=r}
      note="Synced to your account (private to you).";persist();render();
    }
  }catch(e){}
}
function last(n){for(let i=S.sessions.length-1;i>=0;i--){const x=S.sessions[i].ex[n];if(x)return x}return null}
function render(){
  $("tt").className=tab=="t"?"on":"";$("tp").className=tab=="p"?"on":"";$("st").textContent=note;
  $("app").innerHTML=tab=="t"?train():prog();
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{day=+b.dataset.d;draft={};render()});
  document.querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{draft[i.dataset.k]=i.value});
  const g=$("save");if(g)g.onclick=save;const a=$("addbw");if(a)a.onclick=addbw;
}
function train(){
  const [nm,ex]=D[day];
  let h='<div class="days">'+D.map((d,i)=>`<button data-d="${i}" class="${i==day?"on":""}">Day ${i+1}</button>`).join("")+"</div><h2>"+nm+"</h2>";
  h+=ex.map(([n,t])=>{
    const k=parseInt(t),L=last(n);
    const hint=L?"Last: "+L.map(s=>s[0]+" x "+s[1]).join(", "):"No history yet";
    let rows="";
    for(let i=0;i<k;i++){const p=L&&L[i]?L[i]:["",""];
      rows+=`<div class="r"><b>${i+1}</b><input type="number" inputmode="decimal" placeholder="${p[0]||"kg"}" value="${draft[n+"|"+i+"w"]||""}" data-k="${n}|${i}w"><input type="number" inputmode="numeric" placeholder="${p[1]||"reps"}" value="${draft[n+"|"+i+"r"]||""}" data-k="${n}|${i}r"></div>`}
    const q=encodeURIComponent(n.replace(" (optional)","")+" proper form");
    return `<div class="c"><div class="t">${n}<span>${t}</span></div><div class="h">${hint}</div>${rows}<div class="l"><a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">Images</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Video</a></div></div>`}).join("");
  return h+'<button class="go" id="save">Save session</button>';
}
function save(){
  const ex={};
  D[day][1].forEach(([n,t])=>{const k=parseInt(t),a=[];
    for(let i=0;i<k;i++){const w=parseFloat(draft[n+"|"+i+"w"]),r=parseInt(draft[n+"|"+i+"r"]);
      if(w>=0&&r>0)a.push([w,r])}
    if(a.length)ex[n]=a});
  if(!Object.keys(ex).length){note="Enter at least one set first.";render();return}
  S.sessions.push({d:today(),day:D[day][0],ex});draft={};persist();note="Session saved. Nice work.";render();
}
function addbw(){const v=parseFloat($("bwin").value);if(!(v>30&&v<250))return;
  S.bw=S.bw.filter(x=>x.d!=today());S.bw.push({d:today(),w:v});S.bw.sort((a,b)=>a.d<b.d?-1:1);persist();render()}
function spark(v){if(v.length<2)return"<svg></svg>";
  const mn=Math.min(...v),mx=Math.max(...v),f=x=>mx==mn?14:26-((x-mn)/(mx-mn))*24;
  return`<svg viewBox="0 0 90 28"><polyline points="${v.map((x,i)=>(i*88/(v.length-1)+1)+","+f(x)).join(" ")}"/></svg>`}
function prog(){
  const days=(a,b)=>(new Date(b)-new Date(a))/864e5;
  let h='<h2>Bodyweight</h2><div class="c"><div class="row"><input id="bwin" type="number" inputmode="decimal" placeholder="Today’s weight (kg)"><button id="addbw">Add</button></div>';
  const bw=S.bw;
  if(bw.length){h+=`<div class="m"><span>Latest: <b>${bw[bw.length-1].w} kg</b></span>${spark(bw.map(x=>x.w))}</div>`}
  h+="</div>";
  const v=[];
  const rec=bw.filter(x=>days(x.d,today())<=35);
  if(rec.length>=2&&days(rec[0].d,rec[rec.length-1].d)>=14){
    const r=(rec[rec.length-1].w-rec[0].w)/(days(rec[0].d,rec[rec.length-1].d)/7);
    v.push(r<0.1?["dn",`Weight is moving ${r.toFixed(2)} kg/week. For size you want roughly +0.15 to +0.35 kg/week, so consider adding 150–250 kcal/day.`]:r>0.5?["dn",`Weight is up ${r.toFixed(2)} kg/week, which is fast. Extra gain is likely fat, so trim the surplus a little.`]:["up",`Weight is up ${r.toFixed(2)} kg/week. That’s in the sweet spot.`])}
  const names={};S.sessions.forEach(s=>Object.entries(s.ex).forEach(([n,sets])=>{
    (names[n]=names[n]||[]).push({d:s.d,v:Math.max(...sets.map(x=>e1(x[0],x[1])))})}));
  let up=0,tot=0,rows="";
  Object.entries(names).forEach(([n,a])=>{
    const ch=a.length>1?(a[a.length-1].v/a[0].v-1)*100:null;
    if(ch!==null&&days(a[0].d,a[a.length-1].d)>=14){tot++;if(ch>0)up++}
    rows+=`<div class="m"><span>${n}<br><small class="${ch>0?"up":"dn"}">${ch===null?"1 session":(ch>=0?"+":"")+ch.toFixed(1)+"% est. 1RM"}</small></span>${spark(a.map(x=>x.v))}</div>`});
  if(tot)v.push(up/tot>=0.6?["up",`${up} of ${tot} lifts are stronger than when you started. Progressive overload is working.`]:["dn",`Only ${up} of ${tot} lifts are up. Check sleep, protein and calories, and make sure you’re adding weight once you hit the top of the rep range.`]);
  const wk=S.sessions.filter(s=>days(s.d,today())<28).length/4;
  if(S.sessions.length)v.push([wk>=3?"up":"dn",`You’re averaging ${wk.toFixed(1)} sessions/week over the last 4 weeks (target 4).`]);
  h+="<h2>Am I on track?</h2>"+(v.length?v.map(x=>`<div class="v ${x[0]}">${x[1]}</div>`).join(""):'<div class="v">Log a few sessions and a couple of weigh-ins over 2+ weeks and I’ll show whether you’re progressing.</div>');
  h+="<h2>Strength trend</h2><div class='c'>"+(rows||"<div class='h'>Nothing logged yet.</div>")+"</div>";
  return h;
}
$("tt").onclick=()=>{tab="t";render()};$("tp").onclick=()=>{tab="p";render()};
init();
</script></body></html>
